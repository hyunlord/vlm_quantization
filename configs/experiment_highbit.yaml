# Experiment config: extended Matryoshka (256/512-bit) + backbone A/B candidates.
#
# Backbone is FROZEN here, so swapping it only retrains the small per-modality
# hash heads (fast) — backbone A/B is cheap. Pick ONE backbone below, retrain,
# then compare with scripts/bench_search.py + the cross-modal eval comparison.
#
# NOTE: embed_dim is auto-detected from the backbone config (projection_dim /
# vision hidden_size), so you do NOT need to set it. image_size MUST match the
# chosen backbone's native resolution (see comments).

model:
  # ---- backbone candidates (uncomment exactly ONE) ----
  backbone: "google/siglip2-so400m-patch14-384"        # baseline: still SOTA open image-text (Jun 2026), multilingual-trained, ~1152-d, 384px
  # backbone: "google/siglip2-giant-opt-patch16-384"   # larger SigLIP2 (~1536-d, 384px). True drop-in. Retrieval gain over so400m is uncertain — measure.
  # backbone: "facebook/metaclip-2-worldwide-huge-378" # MetaCLIP 2 ViT-H/14, 300+ languages (best Korean potential). Near drop-in (HF CLIP API). SET image_size: 378
  # backbone: "jinaai/jina-clip-v2"                     # multilingual (incl. Korean), retrieval-tuned. Needs code changes (custom processor/features, trust_remote_code).

  bit_list: [8, 16, 32, 48, 64, 128, 256, 512]         # extended nested codes (was up to 128)
  hidden_dim: 768                                       # bumped 512 -> 768 to feed the longer 256/512-bit codes with enough capacity
  dropout: 0.1
  freeze_backbone: true                                 # cheap backbone A/B: only the hash heads train

training:
  batch_size: 256
  max_epochs: 30
  hash_lr: 1.0e-3
  backbone_lr: 1.0e-5      # unused while frozen; kept for an optional unfreeze run
  weight_decay: 0.01
  warmup_steps: 2000
  gradient_clip_val: 1.0
  accumulate_grad_batches: 1
  val_check_interval: 0.5
  early_stopping_patience: 5
  checkpoint_dir: "checkpoints"

loss:
  contrastive_weight: 1.0
  ortho_weight: 0.1
  quantization_weight: 0.1
  balance_weight: 0.01
  consistency_weight: 0.5
  lcs_weight: 0.5
  supervised_weight: 0.0
  temperature: 0.07
  ema_decay: 0.99
  focal_gamma: 0.0  # > 0 enables focal InfoNCE; 0 = plain InfoNCE

data:
  data_root: "data/coco"
  karpathy_json: "data/coco/dataset_coco.json"
  num_workers: 4
  max_text_length: 64
  image_size: 384   # 384 for SigLIP2 (so400m / giant). Set to 378 for MetaCLIP 2 worldwide-huge-378.
  num_captions: 1
  # Korean / multilingual training data.
  # ⚠ LEAKAGE: data/coco_ko/coco_ko.jsonl contains ALL 123,287 COCO images,
  #   INCLUDING the 5,000 Karpathy test + 5,000 val images. Training on it leaks
  #   the eval images. Use the FILTERED file (train+restval only, leakage=0):
  extra_datasets:
    - jsonl_path: "data/coco_ko/coco_ko_train.jsonl"   # 113,287 lines, no test/val leakage
      data_root: "data/coco"
    # - jsonl_path: "data/aihub/aihub_71454.jsonl"     # currently MISSING on DGX
    # - jsonl_path: "data/cc3m_ko/cc3m_ko.jsonl"        # currently MISSING on DGX

monitor:
  enabled: true
  server_url: "http://localhost:8001"
  log_every_n_steps: 10
