<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>1-bit 브라우저 검색 데모</title>
<link rel="manifest" href="/manifest.webmanifest" />
<meta name="theme-color" content="#0b0d12" />
<style>
  :root {
    --bg: #0b0d12; --panel: #141821; --line: #232938; --txt: #e7ebf3;
    --muted: #8b94a7; --accent: #5b9dff; --accent2: #36d399; --warn: #f0a73b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--txt);
    font-family: -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", Segoe UI, Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  header { padding: 28px 24px 14px; max-width: 1100px; margin: 0 auto; }
  h1 { margin: 0 0 6px; font-size: 22px; font-weight: 650; letter-spacing: -0.2px; }
  .sub { color: var(--muted); font-size: 13.5px; line-height: 1.5; }
  .sub b { color: var(--accent2); font-weight: 600; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 0 24px 60px; }
  .searchbar { display: flex; gap: 10px; margin: 18px 0 10px; }
  #q {
    flex: 1; padding: 13px 16px; font-size: 15px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--panel); color: var(--txt);
  }
  #q:focus { outline: none; border-color: var(--accent); }
  #mode {
    padding: 0 12px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--panel); color: var(--txt); font-size: 13.5px; cursor: pointer;
  }
  button.go {
    padding: 0 22px; border: none; border-radius: 10px; cursor: pointer;
    background: var(--accent); color: #06101f; font-weight: 650; font-size: 15px;
  }
  button.go:disabled { opacity: .5; cursor: default; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
  .chip {
    padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line);
    background: var(--panel); color: var(--muted); font-size: 13px; cursor: pointer;
  }
  .chip:hover { color: var(--txt); border-color: var(--accent); }
  #status { font-size: 13px; color: var(--muted); min-height: 20px; margin: 6px 0; }
  #status .ok { color: var(--accent2); }
  #status .warn { color: var(--warn); }
  .bar { height: 6px; background: var(--line); border-radius: 4px; overflow: hidden; margin: 8px 0; }
  .bar > i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .15s; }
  #stats { font-size: 13px; color: var(--muted); margin: 10px 0 16px; }
  #stats b { color: var(--txt); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .card .imgwrap { aspect-ratio: 1/1; background: #0f1219; display: flex; align-items: center; justify-content: center; }
  .card img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .card .info { padding: 8px 9px; font-size: 11.5px; color: var(--muted); }
  .card .cap { color: var(--txt); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 30px; }
  .card .dist { color: var(--accent); font-variant-numeric: tabular-nums; margin-top: 4px; }
  footer { max-width: 1100px; margin: 0 auto; padding: 0 24px; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
  <header>
    <h1>1-bit 브라우저 검색 데모</h1>
    <p class="sub">
      한국어/영어 쿼리를 입력하면 서버는 <b>텍스트만 1024-bit 코드로 인코딩</b>합니다.
      검색(해밍 거리 Top-K)은 <b>전부 브라우저 안에서</b> 실행됩니다 — 벡터DB도, 검색 추론비용도 없습니다.
    </p>
  </header>
  <div class="wrap">
    <div class="searchbar">
      <input id="q" type="text" placeholder="예: 바닷가 강아지 / a snowy mountain" autocomplete="off" />
      <select id="mode" title="쿼리 인코딩 모드">
        <option value="server">정확(서버)</option>
        <option value="offline">오프라인(브라우저)</option>
      </select>
      <button id="go" class="go" disabled>검색</button>
    </div>
    <div class="chips" id="chips"></div>
    <div id="status">인덱스 로딩 준비 중…</div>
    <div class="bar"><i id="prog"></i></div>
    <div id="stats"></div>
    <div class="grid" id="grid"></div>
  </div>
  <footer>head: <span id="headname">?</span> · 1024-bit (128 B/이미지) · 클라이언트 해밍 검색</footer>
  <script type="module" src="/app.js"></script>
</body>
</html>
