name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install numpy "pytest>=8.0" "ruff>=0.6"

      - name: Lint (ruff)
        run: ruff check src/ tests/ eval.py train.py optuna_search.py monitor/callback.py

      - name: Test (pytest)
        run: pytest tests/ -q
